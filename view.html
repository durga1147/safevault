<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteVault | Secure Gateway</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gateway-shell { width: 100%; max-width: 650px; margin: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; position: relative; z-index: 20; }
        .centered-card { padding: 4rem 2.5rem; text-align: center; display: flex; flex-direction: column; gap: 1.5rem; align-items: center; }
        .stacked-list-box { width: 100%; text-align: left; padding: 2rem; background: var(--bg-canvas); border: 2px solid var(--secondary); border-radius: var(--radius-card); }
        
        .visitor-note-card { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; border: 2px solid var(--border-light); border-radius: var(--radius-input); background: var(--surface); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .visitor-note-card h4 { font-size: 1.2rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid var(--border-light); padding-bottom: 0.75rem; }
        .visitor-note-card .note-content { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="screen active" style="align-items: flex-start; padding-top: 5vh; overflow-y: auto;">
        <!-- Locked Gateway -->
        <div class="gateway-shell" id="unlock-container">
            <div class="ui-card centered-card">
                <span class="icon-3d large-icon">🛡️</span>
                <h3 style="font-size: 1.5rem; font-weight: 800;">NoteVault Gateway</h3>
                
                <div id="pin-section" class="form-group hidden" style="width: 100%; margin-top: 1rem;">
                    <label style="color: var(--text-muted);">Enter Access PIN</label>
                    <input type="password" id="access-pin" class="ui-input center-text" placeholder="••••" style="font-size: 1.5rem; letter-spacing: 0.3em; padding: 1rem;">
                </div>
                
                <button id="access-btn" class="btn-3d primary full" style="margin-top: 1rem;">Decrypt Notebook</button>
            </div>
        </div>

        <!-- Decrypted Notebook Notes -->
        <div class="gateway-shell hidden" id="destination-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, addDoc, collection, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
const firebaseConfig = {
          apiKey: "AIzaSyDfXngyekYnG3idV1y-8_fA8Fe8xT9mBkI",
          authDomain: "vault-98419.firebaseapp.com",
          projectId: "vault-98419",
          storageBucket: "vault-98419.firebasestorage.app",
          messagingSenderId: "403052820420",
          appId: "1:403052820420:web:a01d8e9bd29be6b4595691"
};
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');
        
        let sessionRef = null;
        let activeSeconds = 0;

        // --- ADVANCED DEVICE DETECTION ---
        async function getDeviceName() {
            let os = "Unknown Device";
            let browser = "Unknown Browser";
            let exactModel = "";

            const ua = navigator.userAgent;

            if (/Edg/i.test(ua)) browser = "Edge";
            else if (/Firefox/i.test(ua)) browser = "Firefox";
            else if (/Chrome/i.test(ua) && !/Edg|OPR/i.test(ua)) browser = "Chrome";
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/OPR/i.test(ua)) browser = "Opera";

            if (/iPhone/i.test(ua)) { os = "iPhone"; exactModel = "iPhone"; } 
            else if (/iPad/i.test(ua)) { os = "iPad"; exactModel = "iPad"; }
            else if (/Mac OS X/i.test(ua)) { os = "Mac"; exactModel = "MacBook/Mac"; }
            else if (/Windows/i.test(ua)) { os = "Windows PC"; exactModel = "Windows PC"; }
            else if (/Linux/i.test(ua) && !/Android/i.test(ua)) { os = "Linux PC"; exactModel = "Linux PC"; }
            else if (/Android/i.test(ua)) os = "Android";

            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const highEntropy = await navigator.userAgentData.getHighEntropyValues(['model']);
                    if (highEntropy.model) {
                        exactModel = highEntropy.model;
                    }
                } catch (e) { console.warn("Client hints blocked."); }
            }

            if (!exactModel && os === "Android") {
                const match = ua.match(/Android\s[0-9\.]+(?:;\s[a-z]{2}-[a-z]{2})?;\s([^;]+)\sBuild/i);
                if (match && match[1]) exactModel = match[1].trim();
                else exactModel = "Android Device";
            }

            return `${exactModel} (${browser})`;
        }

        async function verifyAndLoad() {
            try {
                if (!linkId) return alert("Invalid Gateway Token.");
                const docRef = doc(db, "shared_gateways", linkId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    document.querySelector('.centered-card').innerHTML = `<span class="icon-3d large-icon">⚠️</span><h3>Gateway Expired</h3><p style="color: var(--text-muted);">This notebook is no longer being shared.</p>`;
                    return;
                }

                // Initialize Live Tracker if not yet set up
                if (!sessionRef) {
                    try {
                        const sessionsCol = collection(db, "shared_gateways", linkId, "sessions");
                        const deviceString = await getDeviceName(); 
                        
                        // DUAL TIMESTAMP BACKUP: Saves both server time and instant browser time
                        sessionRef = await addDoc(sessionsCol, {
                            deviceName: deviceString,
                            status: "Visited",
                            activeTime: 0,
                            openedAtISO: new Date().toISOString(), 
                            timestamp: serverTimestamp() 
                        });

                        setInterval(async () => {
                            if (document.visibilityState === 'visible') {
                                activeSeconds += 5;
                                try { await updateDoc(sessionRef, { activeTime: activeSeconds }); } catch(e){}
                            }
                        }, 5000);
                    } catch(e) { console.warn("Live tracking offline - check Firestore Rules."); }
                }

                const data = docSnap.data();
                const pinSection = document.getElementById('pin-section');
                const pinInput = document.getElementById('access-pin').value;

                if (data.pin && pinSection.classList.contains('hidden')) {
                    pinSection.classList.remove('hidden');
                    return; 
                }

                if (data.pin && data.pin !== pinInput) {
                    alert("Incorrect PIN entered.");
                    document.getElementById('access-pin').value = '';
                    return;
                }

                if (sessionRef) {
                    try { await updateDoc(sessionRef, { status: "Unlocked" }); } catch(e){}
                }

                document.getElementById('unlock-container').classList.add('hidden');
                const destContainer = document.getElementById('destination-container');
                destContainer.classList.remove('hidden');
                
                destContainer.innerHTML = `
                    <div class="stacked-list-box">
                        <div style="display: flex; align-items: center; gap: 1rem; border-bottom: 2px solid var(--secondary-dark); padding-bottom: 1.5rem; margin-bottom: 2rem;">
                            <span class="icon-3d" style="font-size: 2.2rem;">📓</span>
                            <div>
                                <h2 style="font-weight:800; font-size:1.6rem;">${data.folderName}</h2>
                                <p style="color: var(--primary); font-size: 0.9rem; font-weight: 700; margin-top: 0.25rem;">Verified Secure Notebook</p>
                            </div>
                        </div>
                        <div id="gateway-notes-list" style="display: flex; flex-direction: column; gap: 1.5rem;">
                            <p style="color: var(--text-muted);">Decrypting notes...</p>
                        </div>
                    </div>
                `;

                const notesQuery = query(collection(db, "saved_notes"), where("folderId", "==", data.folderId));
                const notesSnapshot = await getDocs(notesQuery);
                const listWrapper = document.getElementById('gateway-notes-list');
                listWrapper.innerHTML = "";

                if(notesSnapshot.empty) {
                    listWrapper.innerHTML = `<p style="color: var(--text-muted); font-style: italic; text-align: center;">This notebook is completely empty.</p>`;
                    return;
                }

                notesSnapshot.forEach(noteDoc => {
                    const noteData = noteDoc.data();
                    const noteItem = document.createElement('div');
                    noteItem.className = "visitor-note-card";
                    noteItem.innerHTML = `
                        <h4><span class="icon-3d">📝</span> ${noteData.title}</h4>
                        <div class="note-content">${noteData.content}</div>
                    `;
                    listWrapper.appendChild(noteItem);
                });
                
            } catch (globalError) {
                console.error("Critical Exception: ", globalError);
                alert("Decryption pipeline failure: " + globalError.message);
            }
        }

        document.getElementById('access-btn').addEventListener('click', verifyAndLoad);
        verifyAndLoad();
    </script>
</body>
</html>
